<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- Base Grassy Land Terrain -->
  <rect width="32" height="32" fill="#82c953" />

  <!-- Pixelated Darker Grass & Earth Terrain Patches Around Edges -->
  <g fill="#5ea33b">
    <rect x="0" y="0" width="32" height="2" />
    <rect x="0" y="2" width="11" height="2" />
    <rect x="21" y="2" width="11" height="2" />
    <rect x="0" y="4" width="6" height="2" />
    <rect x="26" y="4" width="6" height="2" />
    <rect x="0" y="6" width="3" height="4" />
    <rect x="29" y="6" width="3" height="5" />
    <rect x="0" y="22" width="3" height="10" />
    <rect x="29" y="21" width="3" height="11" />
    <rect x="3" y="27" width="8" height="5" />
    <rect x="20" y="27" width="9" height="5" />
    <rect x="11" y="29" width="9" height="3" />
    <rect x="16" y="4" width="3" height="1" />
    <rect x="24" y="5" width="2" height="1" />
    <rect x="5" y="25" width="2" height="1" />
    <rect x="24" y="25" width="2" height="1" />
  </g>

  <g fill="#4a852d">
    <rect x="0" y="0" width="7" height="2" />
    <rect x="25" y="0" width="7" height="2" />
    <rect x="0" y="2" width="3" height="3" />
    <rect x="29" y="2" width="3" height="3" />
    <rect x="0" y="28" width="5" height="4" />
    <rect x="27" y="28" width="5" height="4" />
  </g>

  <!-- Subtle Earthy Ground Specks -->
  <g fill="#b09e70">
    <rect x="4" y="3" width="3" height="2" />
    <rect x="28" y="23" width="3" height="3" />
    <rect x="10" y="29" width="4" height="2" />
  </g>

  <!-- Lighter Meadow Grass Pixels -->
  <g fill="#96d663">
    <rect x="19" y="7" width="4" height="2" />
    <rect x="9" y="22" width="4" height="2" />
    <rect x="19" y="22" width="3" height="2" />
  </g>

  <!-- Cute Pixel-Art Cottage (Upper-Left Clearing) -->
  <!-- Roof shadow/outline -->
  <rect x="7" y="6" width="5" height="1" fill="#7c2d12" />
  <rect x="8" y="5" width="3" height="1" fill="#b84a39" />
  <rect x="9" y="4" width="1" height="1" fill="#c25745" />
  <rect x="8" y="6" width="3" height="1" fill="#b84a39" />
  <!-- Cream walls -->
  <rect x="8" y="7" width="3" height="3" fill="#fef3c7" />
  <!-- Wooden door -->
  <rect x="9" y="8" width="1" height="2" fill="#854d0e" />

  <!-- Tiny Pixel Flower Dots -->
  <!-- Near house pink tiny dot flower -->
  <rect x="5" y="9" width="1" height="1" fill="#f472b6" />
  <rect x="6" y="8" width="1" height="1" fill="#f472b6" />
  <rect x="6" y="9" width="1" height="1" fill="#fde047" />
  <rect x="7" y="10" width="1" height="1" fill="#f472b6" />

  <!-- Top-right yellow & white tiny dot flowers -->
  <rect x="22" y="7" width="1" height="1" fill="#fde047" />
  <rect x="23" y="8" width="1" height="1" fill="#ffffff" />
  <rect x="24" y="7" width="1" height="1" fill="#fde047" />
  <rect x="25" y="9" width="1" height="1" fill="#ffffff" />

  <!-- Bottom-left pink & yellow tiny dots -->
  <rect x="7" y="23" width="1" height="1" fill="#f472b6" />
  <rect x="8" y="24" width="1" height="1" fill="#fde047" />
  <rect x="10" y="23" width="1" height="1" fill="#f472b6" />

  <!-- Bottom-right white tiny dots -->
  <rect x="23" y="23" width="1" height="1" fill="#ffffff" />
  <rect x="24" y="24" width="1" height="1" fill="#fde047" />
  <rect x="25" y="23" width="1" height="1" fill="#ffffff" />

  <!-- Middle Row Side Grass Border -->
  <rect x="0" y="11" width="3" height="10" fill="#5ea33b" />
  <rect x="29" y="11" width="3" height="10" fill="#5ea33b" />

  <!-- Darker Earthy Soil Brown Outline (1px pad around M i n e M A P) -->
  <g fill="#5c3a21">
    <!-- M1 halo -->
    <rect x="1" y="12" width="7" height="8" />
    <!-- i halo -->
    <rect x="7" y="12" width="3" height="8" />
    <!-- n halo -->
    <rect x="9" y="14" width="5" height="6" />
    <!-- e halo -->
    <rect x="13" y="14" width="5" height="6" />
    <!-- M2 halo -->
    <rect x="17" y="12" width="7" height="8" />
    <!-- A halo -->
    <rect x="23" y="12" width="5" height="8" />
    <!-- P halo -->
    <rect x="27" y="12" width="5" height="8" />
  </g>

  <!-- Brighter Vibrant Ocean-Turquoise Water Pixels: "MineMAP" -->
  <!-- M1 (x=2..6, y=13..18) -->
  <g fill="#67e8f9">
    <rect x="2" y="13" width="1" height="2" />
    <rect x="3" y="14" width="1" height="1" />
    <rect x="5" y="14" width="1" height="1" />
    <rect x="6" y="13" width="1" height="2" />
  </g>
  <g fill="#22d3ee">
    <rect x="2" y="15" width="1" height="2" />
    <rect x="4" y="15" width="1" height="2" />
    <rect x="6" y="15" width="1" height="2" />
  </g>
  <g fill="#0ea5e9">
    <rect x="2" y="17" width="1" height="2" />
    <rect x="6" y="17" width="1" height="2" />
  </g>

  <!-- i (x=8, y=13..18) -->
  <rect x="8" y="13" width="1" height="1" fill="#67e8f9" />
  <rect x="8" y="15" width="1" height="2" fill="#22d3ee" />
  <rect x="8" y="17" width="1" height="2" fill="#0ea5e9" />

  <!-- n (x=10..12, y=15..18) -->
  <g fill="#22d3ee">
    <rect x="10" y="15" width="3" height="1" />
    <rect x="10" y="16" width="1" height="1" />
    <rect x="12" y="16" width="1" height="1" />
  </g>
  <g fill="#0ea5e9">
    <rect x="10" y="17" width="1" height="2" />
    <rect x="12" y="17" width="1" height="2" />
  </g>

  <!-- e (x=14..16, y=14..18) -->
  <rect x="14" y="14" width="3" height="1" fill="#67e8f9" />
  <g fill="#22d3ee">
    <rect x="14" y="15" width="1" height="2" />
    <rect x="16" y="15" width="1" height="1" />
    <rect x="15" y="16" width="2" height="1" />
  </g>
  <g fill="#0ea5e9">
    <rect x="14" y="17" width="1" height="2" />
    <rect x="15" y="18" width="2" height="1" />
  </g>

  <!-- M2 (x=18..22, y=13..18) -->
  <g fill="#67e8f9">
    <rect x="18" y="13" width="1" height="2" />
    <rect x="19" y="14" width="1" height="1" />
    <rect x="21" y="14" width="1" height="1" />
    <rect x="22" y="13" width="1" height="2" />
  </g>
  <g fill="#22d3ee">
    <rect x="18" y="15" width="1" height="2" />
    <rect x="20" y="15" width="1" height="2" />
    <rect x="22" y="15" width="1" height="2" />
  </g>
  <g fill="#0ea5e9">
    <rect x="18" y="17" width="1" height="2" />
    <rect x="22" y="17" width="1" height="2" />
  </g>

  <!-- A (x=24..26, y=13..18) -->
  <rect x="25" y="13" width="1" height="1" fill="#67e8f9" />
  <g fill="#67e8f9">
    <rect x="24" y="14" width="1" height="1" />
    <rect x="26" y="14" width="1" height="1" />
  </g>
  <g fill="#22d3ee">
    <rect x="24" y="15" width="1" height="2" />
    <rect x="25" y="16" width="1" height="1" />
    <rect x="26" y="15" width="1" height="2" />
  </g>
  <g fill="#0ea5e9">
    <rect x="24" y="17" width="1" height="2" />
    <rect x="26" y="17" width="1" height="2" />
  </g>

  <!-- P (x=28..30, y=13..18) -->
  <g fill="#67e8f9">
    <rect x="28" y="13" width="2" height="1" />
    <rect x="28" y="14" width="1" height="1" />
    <rect x="30" y="14" width="1" height="1" />
  </g>
  <g fill="#22d3ee">
    <rect x="28" y="15" width="1" height="2" />
    <rect x="29" y="16" width="1" height="1" />
    <rect x="30" y="15" width="1" height="1" />
  </g>
  <rect x="28" y="17" width="1" height="2" fill="#0ea5e9" />
</svg>
